name: Keep Render Alive

on:
  schedule:
    # Run every 5 minutes to keep the free Render deployment alive
    # (Render free tier spins down after 15 minutes of inactivity)
    - cron: "*/5 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Render web service
        run: |
          curl -fsS "${PING_URL:-https://prospectpulse-api.onrender.com/health}" || true
